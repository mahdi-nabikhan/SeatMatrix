services:

  redis:
    image: redis:7-alpine
    container_name: seatmatrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  db:
    image: postgres:15-alpine
    container_name: seatmatrix_postgres
    restart: always
    environment:
      POSTGRES_DB: seatmatrix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: seatmatrix_django
    command: python manage.py runserver 0.0.0.0:8088
    volumes:
      - .:/app  
    ports:
      - "8088:8088"
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=seatmatrix_db
      - DB_USER=postgres
      - DB_PASS=123


  minio:
    image: focker.ir/minio/minio:latest
    container_name: cinema_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  
      - "9001:9001"   
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data: