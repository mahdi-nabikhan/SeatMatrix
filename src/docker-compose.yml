services:

  redis:
    image: redis:7-alpine
    container_name: seatmatrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  
  db:
    image: postgres:15-alpine
    container_name: seatmatrix_postgres
    restart: always
    environment:
      POSTGRES_DB: seatmatrix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  celery_worker:
    build: .
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A core beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  web:
    build: .
    container_name: seatmatrix_django
    command: python manage.py runserver 0.0.0.0:8088
    volumes:
      - .:/app  
    ports:
      - "8088:8088"
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=seatmatrix_db
      - DB_USER=postgres
      - DB_PASS=123


  minio:
    image: focker.ir/minio/minio:latest
    container_name: cinema_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  
      - "9001:9001"   
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.arvancloud.ir/elasticsearch:8.15.0
    container_name: seatmatrix_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  redis_data:
  es_data: