version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: seatmatrix_postgres
    restart: always
    environment:
      POSTGRES_DB: seatmatrix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: seatmatrix_django
    
    command: python manage.py runserver 0.0.0.0:8008
    volumes:
      - .:/app  
    ports:
      - "8088:8088"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=seatmatrix_db
      - DB_USER=postgres
      - DB_PASS=123

volumes:
  postgres_data: